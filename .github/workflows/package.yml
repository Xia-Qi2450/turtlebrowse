name: Build multi-platform binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Shadow JAR
    runs-on: ubuntu-latest
    outputs:
      artifact-name: shadow-jar-${{ github.run_id }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Upload Shadow JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-jar-${{ github.run_id }}
          path: app/build/libs/app-all.jar

  jpackage:
    name: Package for ${{ matrix.os-name }} (${{ matrix.arch }})
    needs: build-jar
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS
            arch: ARM64

          - os: windows-latest
            os-name: Windows
            arch: AMD64
          - os: windows-11-arm
            os-name: Windows
            arch: ARM64

          - os: ubuntu-latest
            os-name: Ubuntu
            arch: AMD64
            pkg-type: deb
          - os: ubuntu-24.04-arm
            os-name: Ubuntu
            arch: ARM64
            pkg-type: deb

          - os: ubuntu-latest
            os-name: Fedora
            arch: AMD64
            pkg-type: rpm
          - os: ubuntu-24.04-arm
            os-name: Fedora
            arch: ARM64
            pkg-type: rpm

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Packaging Tools (Fedora/Ubuntu specific)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.os-name }}" = "Fedora" ]; then
            sudo apt-get install -y rpm
          else
            sudo apt-get install -y dpkg devscripts
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Built Shadow JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-jar.outputs.artifact-name }}
          path: app/build/libs/

      - name: Run jpackage via Gradle
        shell: bash
        run: |
          ./gradlew jpackage \
            -PtargetOs="${{ matrix.os-name }}" \
            -PtargetArch="${{ matrix.arch }}" \
            -PtargetPkgType="${{ matrix.pkg-type }}"

      - name: Upload Native Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: turtlebrowse_${{ matrix.os-name }}_${{ matrix.arch }}
          path: |
            app/build/libs/app-all.jar
            app/build/dist/*.deb
            app/build/dist/*.rpm
            app/build/dist/*.exe
            app/build/dist/*.msi
            app/build/dist/*.dmg
            app/build/dist/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-jar, jpackage]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && (needs.build-jar.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Create Work Directory
        run: mkdir release-artifacts

      - name: Download All Native Installers and Jars
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          pattern: turtlebrowse_*
          merge-multiple: true

      - name: Rename Shadow JAR
        run: |
          if [ -f "release-artifacts/app-all.jar" ]; then
            mv release-artifacts/app-all.jar release-artifacts/turtlebrowse_jar.jar
          else
            echo "Error: app-all.jar not found in collected assets"
            exit 1
          fi

      - name: Display Collected Assets
        run: ls -R release-artifacts/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            release-artifacts/turtlebrowse_jar.jar
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.dmg
            release-artifacts/*.pkg